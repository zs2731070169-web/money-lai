<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- money-lai App 图标：治愈系钱包 + 抽出的 lai 纸币。
       色板全部取自项目设计令牌（design-tokens.ts）：
       黄昏粉彩底 / 皮革 B08968 / 内衬 6B7F74 / 豆绿纸币 A9C4AE / 印墨 6E8F78
       缝线 F2E5D0 / 蜜金点缀 C89B4B / 光源左上 -->

  <defs>
    <!-- 背景粉彩渐变（黄昏色板） -->
    <linearGradient id="ml-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EFE4"/>
      <stop offset="1" stop-color="#F1DEC9"/>
    </linearGradient>
    <!-- 左上柔光（单一光源纪律） -->
    <radialGradient id="ml-toplight" cx="0.3" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 皮革受光（左上亮 → 右下暗） -->
    <linearGradient id="ml-leather" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#B08968"/>
      <stop offset="0.62" stop-color="#B08968"/>
      <stop offset="1" stop-color="#97755A"/>
    </linearGradient>
    <!-- 纸币受光 -->
    <linearGradient id="ml-bill" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#B1CBb6"/>
      <stop offset="1" stop-color="#A9C4AE"/>
    </linearGradient>
  </defs>

  <!-- 底色（不透明满幅，iOS 图标规范） -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#ml-bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#ml-toplight)"/>

  <!-- 主体缩放容器（实测反馈：缩小留空气感） -->
  <g transform="translate(102.4 108) scale(0.8)">

  <!-- 后侧纸币（暖纸白，只露一角，造层次） -->
  <g transform="rotate(4 512 430)">
    <rect x="372" y="238" width="280" height="330" rx="14" fill="#F4EFE2" stroke="#DCCFB4" stroke-width="3"/>
  </g>

  <!-- 前侧 lai 纸币（豆绿 + 版画纹样，微倾显「抽出」动势） -->
  <g transform="rotate(-7 512 430)">
    <rect x="352" y="212" width="320" height="360" rx="16" fill="url(#ml-bill)"/>
    <!-- 雕版内框：外实线 + 内细线 -->
    <rect x="372" y="232" width="280" height="320" rx="10" fill="none" stroke="#6E8F78" stroke-width="4" stroke-opacity="0.75"/>
    <rect x="384" y="244" width="256" height="296" rx="8" fill="none" stroke="#6E8F78" stroke-width="2" stroke-opacity="0.45"/>
    <!-- 中央对折痕（亮 + 暗双线） -->
    <rect x="509" y="236" width="2.5" height="312" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="512.5" y="236" width="2.5" height="312" fill="#6E8F78" fill-opacity="0.35"/>
    <!-- 左右小椭圆装饰带 -->
    <ellipse cx="414" cy="392" rx="17" ry="26" fill="none" stroke="#6E8F78" stroke-width="3" stroke-opacity="0.55"/>
    <ellipse cx="610" cy="392" rx="17" ry="26" fill="none" stroke="#6E8F78" stroke-width="3" stroke-opacity="0.55"/>
    <!-- 中央面值圆徽 -->
    <circle cx="512" cy="392" r="52" fill="none" stroke="#6E8F78" stroke-width="4" stroke-opacity="0.7"/>
    <text x="512" y="392" text-anchor="middle" dominant-baseline="central"
          font-family="ui-rounded, 'SF Pro Rounded', 'Yuanti SC', 'PingFang SC', sans-serif"
          font-size="58" font-weight="700" fill="#6E8F78">$</text>
  </g>


  <!-- 钱包（皮革主体，盖住纸币下端 = 「装着钱」） -->
  <g>
    <!-- 内衬口（钱包开口的深色缝） -->
    <rect x="232" y="492" width="560" height="44" rx="22" fill="#6B7F74"/>
    <!-- 主体 -->
    <rect x="232" y="512" width="560" height="320" rx="46" fill="url(#ml-leather)"/>
    <!-- 顶缘受光 -->
    <rect x="232" y="512" width="560" height="320" rx="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <!-- 缝线（虚线，钱包语言） -->
    <path d="M268 556 L756 556" stroke="#F2E5D0" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="20 16" fill="none" opacity="0.9"/>
    <!-- 底部缝线 -->
    <path d="M268 796 L756 796" stroke="#F2E5D0" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="20 16" fill="none" opacity="0.55"/>
    <!-- 钮扣小圆（deep 皮革） -->
    <circle cx="512" cy="688" r="17" fill="#8C6647"/>
    <circle cx="512" cy="688" r="8" fill="#F2E5D0" opacity="0.85"/>
  </g>
  </g>
</svg>
