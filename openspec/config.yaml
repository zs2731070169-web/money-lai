schema: spec-driven

context: |
  money-lai 是离线运行的钱包抽钞小游戏，目标平台为 Web/Capacitor iOS，后续可增加其他平台适配器。
  技术栈：TypeScript、Canvas 2D、Vite、Vitest、Capacitor。
  openspec/specs/ 是产品行为的主规格；src/core/ 是平台无关内核，src/adapters/web.ts 实现 PlatformAdapter。
  核心状态机和几何计算优先保持纯函数，平台副作用由 src/core/game.ts 编排。
  改动前先检查工作区已有编辑；验证入口是 npm run verify，规格校验入口是 npm run verify:specs。

