<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：全屏延展到刘海/Home 指示条区域，安全区由适配层读取下列 CSS 变量 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7EFE4" />
    <title>燃信</title>
    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
      }
      html,
      body {
        position: fixed;
        inset: 0;
        overflow: hidden;
        /* touch-action 不能在 body 上设 none：祖先链取交集会压掉 DOM 输入层 pan-y 滚动；
           画布手势所需的 none 改由适配器在 canvas 元素上设置。 */
        overscroll-behavior: none;
        margin: 0;
        /* 暖纸背景，与首帧画布保持一致。 */
        background: #f7efe4;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 自绘邮箱类型菜单由 WebKit 当作可点按区域；默认触摸高亮会盖住暖纸按钮数帧。 */
      .mail-domain-dropdown,
      .mail-domain-dropdown * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
